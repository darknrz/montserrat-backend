name: Keep Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend (keeps Render awake and touches Supabase)
        run: curl -sf -o /dev/null -w "HTTP %{http_code}\n" https://montserrat-backend.onrender.com/api/institution
