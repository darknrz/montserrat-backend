# Server
server.port=8080

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/monserrat_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Toloveru212}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT - Change this secret in production (min 256 bits)
jwt.secret=${JWT_SECRET:change-this-jwt-secret-in-production-with-at-least-32-bytes}
jwt.expiration=86400000

# Groq AI - set GROQ_API_KEY in the environment for real AI responses
groq.api.key=${GROQ_API_KEY:}
groq.model=llama-3.1-8b-instant

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dtjbgzkge}
cloudinary.api-key=${CLOUDINARY_API_KEY:734253233879391}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:EHvfAQYAUStAnkkOhHUQJ5DzTpQ}
cloudinary.folder=${CLOUDINARY_FOLDER:monserrat}

# App admin seed
app.admin.username=${APP_ADMIN_USERNAME:adminmontserrat}
app.admin.password=${APP_ADMIN_PASSWORD:adminmontserrat}

# CORS / WebSocket
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,http://localhost,http://127.0.0.1}

# Multipart
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Logs
logging.level.com.monserrat=INFO
logging.level.org.springframework.security=INFO
